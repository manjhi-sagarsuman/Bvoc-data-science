<html>
<body>
<script>
let marks = 85;

if (marks >= 0 && marks <= 100) {
    if (marks >= 90) {
        console.log("Grade A");
    } else if (marks >= 75) {
        console.log("Grade B");
    } else if (marks >= 60) {
        console.log("Grade C");
    } else if (marks >= 40) {
        console.log("Grade D");
    } else {
        console.log("Fail");
    }
} else {
    console.log("Invalid marks");
}
</script>
</body>
</html>
