<!-- Class in JavaScript -->
 <html>
<body>
<script>
class Student {
    constructor(name, course) {
        this.name = name;
        this.course = course;
    }

    display() {
        console.log("Name:", this.name);
        console.log("Course:", this.course);
    }
}

let s1 = new Student("Sagar", "Data Science");
s1.display();
</script>
</body>
</html>
