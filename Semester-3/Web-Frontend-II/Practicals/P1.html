<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Practical</title>
</head>
<body>

    <h2>JavaScript Variables and Data Types</h2>

    <script>
        var name = "Sagar";
        let age = 18;
        const course = "Data Science";

        document.write("Name: " + name + "<br>");
        document.write("Age: " + age + "<br>");
        document.write("Course: " + course + "<br>");

        document.write("<br>Data Types:<br>");
        document.write(typeof name + "<br>");
        document.write(typeof age + "<br>");
        document.write(typeof true + "<br>");
    </script>

</body>
</html>
