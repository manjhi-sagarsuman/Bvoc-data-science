<html>
<body>
<script>
let n = Number(prompt("Enter number of terms:"));
let a = 0, b = 1, i = 1;
let series = "";

if (Number.isInteger(n) && n > 0) {
    do {
        series += a + " ";
        let next = a + b;
        a = b;
        b = next;
        i++;
    } while (i <= n);

    console.log("Fibonacci Series: " + series);
} else {
    console.log("Enter a positive integer.");
}
</script>
</body>
</html>
