<!-- 5. Function for Basic Arithmetic Operations -->
<html>
<body>
<script>
function add(a, b) {
    return a + b;
}

function subtract(a, b) {
    return a - b;
}

function divide(a, b) {
    return b !== 0 ? a / b : "Cannot divide by zero";
}

console.log("Addition:", add(10, 5));
console.log("Subtraction:", subtract(10, 5));
console.log("Division:", divide(10, 5));
</script>
</body>
</html>
