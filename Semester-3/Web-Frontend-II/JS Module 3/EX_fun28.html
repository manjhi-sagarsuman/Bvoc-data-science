<!-- Create a function that checks whether a number is positive, negative, or zero. -->
<!DOCTYPE html>
<html>
<body>

<script>
    function checkNumber(num) {
        if (num > 0) {
            return "Positive";
        } else if (num < 0) {
            return "Negative";
        } else {
            return "Zero";
        }
    }

    console.log(checkNumber(5));  
    console.log(checkNumber(-3)); 
    console.log(checkNumber(0));  
</script>
</body>
</html>
