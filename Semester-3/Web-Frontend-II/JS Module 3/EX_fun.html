<!-- Create a function that calculates the sum of numbers from 1 to a given number n. -->
<!DOCTYPE html>
<html>
<body>

<script>
    function sum(n) {
        let sum = 0;
        for (let i = 1; i <= n; i++) {
            sum += i;
        }
        return sum;
    }

    console.log(sum(5));  
</script>

</body>
</html>
