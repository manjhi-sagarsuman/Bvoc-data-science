<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Document</title> 
</head> 
<body> 
    <script> 
        let sum = 0; 
        // Changed "i+2" to "i+=2" to properly increment the variable
        for(let i = 2; i <= 20; i += 2) { 
            sum += i; 
        } 
        console.log(sum); // Out: 110
    </script> 
</body> 
</html>
