<!-- Create a function that prints the multiplication table of a number entered by the user. -->
<!DOCTYPE html>
<html>
<body>

<script>
    function Table(num) {
        for (let i = 1; i <= 10; i++) {
            console.log(`${num} x ${i} = ${num * i}`);
        }
    }

    Table(5);
</script>

</body>
</html>
