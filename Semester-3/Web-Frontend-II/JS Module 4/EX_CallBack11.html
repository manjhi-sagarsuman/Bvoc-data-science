<!-- CREATE A FUNCTION THAT RETURN ANOTHER FUNCTION -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <script>
        function createAdder(x) {
            return function(y) {
                return x + y;
            };
        }

        var add5 = createAdder(5);
        console.log(add5(10));
    </script>
 </body>
 </html>
