<!-- Create a function greet() that returns a function displaying "WELCOME" -->
 
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

 </head>
 <body>
    <script>
        function greet(){
            return function(){

            }
        }

        let welcome = greet();
        welcome();
    </script>
