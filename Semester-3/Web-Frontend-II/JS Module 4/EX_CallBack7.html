<!-- Use a Higher Order Function to add two numbers -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <script>
        function add(a, b) {
            return a + b;
        }

        function calculate(func, x, y) {
            console.log(func(x, y));
        }

        calculate(add, 5, 10);
    </script>
 </body>
 </html>
