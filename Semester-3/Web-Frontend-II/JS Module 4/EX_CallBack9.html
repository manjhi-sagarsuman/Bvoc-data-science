<!-- Craete a Higher Order Function to check whether a number is even. -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    script>
        function isEven(num){
            if(num % 2 == 0){
                return true;
            }else{
                return false;
            }
        }

        function calculate(func,x){
            console.log(func(x));
        }

        calculate(isEven, 5);
    </script>
 </body>
 </html>
