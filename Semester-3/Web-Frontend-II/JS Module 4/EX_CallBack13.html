<!-- Create a function that returns a function to add 10 to a number. -->
 
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <script>
        function add(){
            return function(x){
                return x + 10;
            }
        }

        let Add = add();
        console.log(Add(5));
    </script>
 </body>
 </html>
