<!-- Create a Higher Order Functions to check whether a number is positive -->
 
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <script>
        function isPositive(num){
            if(num > 0){
                return true;
            }else{
                return false;
            }
        }

        function calculate(func,x){
            console.log(func(x));
        }

        calculate(isPositive, 5);
    </script>
 </body>
 </html>
