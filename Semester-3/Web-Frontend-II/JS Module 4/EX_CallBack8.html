<!-- Create a Higher Orders function to subtract two numbers -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <script>
        function subtract(a, b) {
            return a - b;
        }

        function calculate(func, x, y) {
            console.log(func(x, y));
        }

        calculate(subtract, 10, 5);
    </script>
 </body>
 </html>
