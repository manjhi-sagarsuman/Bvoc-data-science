<!-- 16. Write a program to calculate the area of a rectangle using user input for length and width. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let length = Number(prompt("Enter the length:"));
        let width = Number(prompt("Enter the width:"));

        let area = length * width;

        alert("Area of Rectangle = " + area);
    </script>
</body>
</html>
