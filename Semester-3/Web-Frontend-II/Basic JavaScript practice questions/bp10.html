<!-- 10. Write a function called greet() that displays "Good Morning". -->

<!DOCTYPE html>
<html>
<head>
    <title>Greet Function</title>
</head>
<body>

    <button onclick="greet()">Click Me</button>

    <script>
        function greet() {
            alert("Good Morning");
        }
    </script>

</body>
</html>
