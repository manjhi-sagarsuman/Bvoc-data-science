<!-- 23. Use prompt() to take a number and display its cube. -->

<!DOCTYPE html>
<html>
<head>
    <title>Cube of a Number</title>
</head>

<body>

    <h2>Find Cube of a Number</h2>

    <script>
        let num = prompt("Enter a number:");
        let cube = num * num * num;

        alert("Cube = " + cube);
    </script>

</body>
</html>
