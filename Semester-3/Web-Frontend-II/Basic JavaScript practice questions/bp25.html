<!-- 25. Write a program to swap two numbers and display the result. -->

<!DOCTYPE html>
<html>
<head>
    <title>Swap Two Numbers</title>
</head>

<body>

    <h2>Swap Two Numbers</h2>

    <script>
        let a = prompt("Enter first number:");
        let b = prompt("Enter second number:");

        alert("Before Swapping:\nA = " + a + "\nB = " + b);

        let temp = a;
        a = b;
        b = temp;

        alert("After Swapping:\nA = " + a + "\nB = " + b);
    </script>

</body>
</html>
