<!-- 18. Use prompt() to take marks and display the result. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Result</title>
</head>
<body>
    <script>
        let marks = Number(prompt("Enter your marks:"));

        if (marks >= 35) {
            alert("Result: Pass");
        } else {
            alert("Result: Fail");
        }
    </script>
</body>
</html>
