<!-- 11. Create a button that calls the greet() function when clicked. -->

<!DOCTYPE html>
<html>
<head>
    <title>Greet Button</title>
</head>
<body>

    <button onclick="greet()">Click Me</button>

    <script>
        function greet() {
            alert("Good Morning");
        }
    </script>

</body>
</html>
