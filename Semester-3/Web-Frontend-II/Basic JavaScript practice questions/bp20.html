<!-- 20. Write a function add() that adds two numbers and displays the result. -->

<!DOCTYPE html>
<html>
<head>
    <title>Add Two Numbers</title>
</head>

<body>

    <h2>Add Two Numbers</h2>

    <button onclick="add()">Add</button>

    <script>
        function add() {
            let a = 10;
            let b = 20;
            let result = a + b;

            alert("Result = " + result);
        }
    </script>

</body>
</html>
