<!-- 5. Use prompt() to take the user's name and display a greeting message. -->

<!DOCTYPE html>
<html>
<head>
    <title>Greeting Message</title>
</head>
<body>

    <h2>Greeting Program</h2>

    <script>
        let name = prompt("Enter your name:");
        document.write("<h3>Hello, " + name + "! Welcome.</h3>");
    </script>

</body>
</html>
