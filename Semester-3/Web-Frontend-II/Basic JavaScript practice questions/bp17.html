<!-- 17. Write a program to calculate the perimeter of a rectangle using user input. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectangle Perimeter</title>
</head>
<body>
    <script>
        let length = Number(prompt("Enter the length:"));
        let width = Number(prompt("Enter the width:"));

        let perimeter = 2 * (length + width);

        alert("Perimeter of Rectangle = " + perimeter);
    </script>
</body>
</html>
