<!-- 22. Use prompt() to take a number and display whether it is even or odd. -->

<!DOCTYPE html>
<html>
<head>
    <title>Even or Odd</title>
</head>

<body>

    <h2>Check Even or Odd</h2>

    <script>
        let num = prompt("Enter a number:");

        if (num % 2 == 0) {
            alert("The number is Even");
        } else {
            alert("The number is Odd");
        }
    </script>

</body>
</html>
