21. Write a function multiply() that multiplies two numbers and displays the result.

<!DOCTYPE html>
<html>
<head>
    <title>Multiply Two Numbers</title>
</head>

<body>

    <h2>Multiply Two Numbers</h2>

    <button onclick="multi()">Add</button>

    <script>
        function multi() {
            let a = 10;
            let b = 20;
            let result = a * b;

            alert("Result = " + result);
        }
    </script>

</body>
</html>
