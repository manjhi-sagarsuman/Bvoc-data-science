<!-- 10. Take a student's marks as input and check whether the marks are greater than or equal to 35. -->

<!DOCTYPE html>
<html>
<head>
    <title>Marks Check</title>
</head>
<body>

<script>
    // Take marks as input
    let marks = Number(prompt("Enter student's marks:"));

    // Check if marks are greater than or equal to 35
    alert("Passed: " + (marks >= 35));
</script>

</body>
</html>
