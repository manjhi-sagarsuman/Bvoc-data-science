<!-- 7. Create a counter variable initialized to 0. Increase it using the increment(++) operator and display the updated value. -->
<!DOCTYPE html>
<html>
<head>
    <title>Counter Example</title>
</head>
<body>

<script>
    // Create a counter variable initialized to 0
    let counter = 0;

    // Increase the counter using the increment (++) operator
    counter++;

    // Display the updated value
    alert("The updated value of the counter is: " + counter);
</script>

</body>
</html>
