<!-- 9. Write a JavaScript program to compare two numbers and display whether the first number is greater than the second number. -->

<!DOCTYPE html>
<html>
<head>
    <title>Compare Two Numbers</title>
</head>
<body>

<script>
    // Get two numbers from the user
    let num1 = Number(prompt("Enter the first number:"));
    let num2 = Number(prompt("Enter the second number:"));

    // Display the result of the comparison
    alert("Is the first number greater than the second? " + (num1 > num2));
</script>

</body>
</html>
