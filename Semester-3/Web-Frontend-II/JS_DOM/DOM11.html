<!-- 11. Take the ages of two people and display whether the first person is older than the second person. -->

<!DOCTYPE html>
<html>
<head>
    <title>Age Comparison</title>
</head>
<body>

<script>
    // Take the ages as input
    let age1 = Number(prompt("Enter the age of the first person:"));
    let age2 = Number(prompt("Enter the age of the second person:"));

    // Display whether the first person is older
    alert("Is the first person older than the second? " + (age1 > age2));
</script>

</body>
</html>
