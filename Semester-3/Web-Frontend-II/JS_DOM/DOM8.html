<!-- 8. Create a counter variable initialized to 10. Decrease it using the decrement (--) operator and display the updated value. -->

<!DOCTYPE html>
<html>
<head>
    <title>Decrement Counter Example</title>
</head>
<body>

<script>
    // Create a counter variable initialized to 10
    let counter = 10;

    // Decrease the counter using the decrement (--) operator
    counter--;

    // Display the updated value
    alert("The updated value of the counter is: " + counter);
</script>

</body>
</html>
