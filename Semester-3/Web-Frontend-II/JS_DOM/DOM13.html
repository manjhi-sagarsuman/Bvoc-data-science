<!-- 13. Write a JavaScript program to check whether a number is less than 100. -->

<!DOCTYPE html>
<html>
<head>
    <title>Check Number Less Than 100</title>
</head>
<body>

<script>
    // Take a number as input
    let num = Number(prompt("Enter a number:"));

    // Check whether the number is less than 100
    alert("Is the number less than 100? " + (num < 100));
</script>

</body>
</html>
