<!-- 6. Write a JavaScript program to calaculate the square of a number using the exponent(** operator). -->
 <!DOCTYPE html>
<html>
<head>
    <title>Square of a Number</title>
</head>
<body>

<script>
    // Ask the user to enter a number
    let num = Number(prompt("Enter a number:"));

    // Calculate the square using the exponent (**) operator
    let square = num ** 2;

    // Display the result
    alert("The square of " + num + " is " + square);
</script>

</body>
</html>
